
name: Get Kahoot Quiz ID

on:
  workflow_dispatch:
    inputs:
      pin:
        description: "Live Kahoot game PIN"
        required: true
        type: string

permissions:
  contents: read

jobs:
  get-game-id:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Inspect Kahoot session
        id: get_game_id
        run: python get_game_id.py "${{ inputs.pin }}"

      - name: Print results
        env:
          GAME_PIN: ${{ inputs.pin }}
          LIVE_ID: ${{ steps.get_game_id.outputs.live_game_id }}
          QUIZ_ID: ${{ steps.get_game_id.outputs.quiz_id }}
        run: |
          echo "========================================"
          echo "Kahoot PIN: $GAME_PIN"
          echo "Live Session ID: $LIVE_ID"

          if [ -n "$QUIZ_ID" ]; then
            echo "Verified Quiz ID: $QUIZ_ID"
          else
            echo "Verified Quiz ID: NOT FOUND"
          fi

          echo "========================================"
